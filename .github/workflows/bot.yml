name: Run Bookish Owl Bot

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *' # Перезапуск каждые 6 часов (лимит бесплатных Actions)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run bot
        env:
          BOOKISH_OWL_TOKEN: ${{ secrets.BOOKISH_OWL_TOKEN }}
        run: python bot.py